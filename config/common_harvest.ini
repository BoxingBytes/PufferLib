[base]
env_name = common_harvest

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 1

[env]
num_agents = 4
report_interval=1
beam_blocks_movement = True
differentiate_other_agents_in_obs = True

[train]
total_timesteps = 200_000_000
horizon = 16
checkpoint_interval = 200
learning_rate = 0.015
gamma = 0.99
gae_lambda = 0.98
vf_coef = 2
ent_coef = 0.001
max_grad_norm = 0.5
vf_clip_coef = 0.1

[sweep]
method = Protein 
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 1200
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
# When set, each sweep trial is scored by winrate in a match against a fixed
# enemy checkpoint rather than by the training-time env/score. Score key emitted
# as env/match_score; set match_enemy_model_path to '' to disable.
match_enemy_model_path = ''
match_num_games = 1024
match_enemy_hidden_size = 0
match_enemy_num_layers = 0

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e6
max = 5e9
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.5
max = 0.9995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
# Lower clip is sometimes better but less stable
min = 0.01
max = 1.0
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-14
max = 1e-4
scale = auto

[sweep.train.prio_alpha]
distribution = uniform 
min = 0.0
max = 1.0
scale = auto


