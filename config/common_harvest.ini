[base]
env_name = common_harvest

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 1

[env]
num_agents = 8
report_interval=1
beam_blocks_movement = True
differentiate_other_agents_in_obs = True
shared_rewards = False
inequity_aversion = True
inequity_aversion_smoothed = True
inequity_aversion_gamma = 0.99
inequity_aversion_lambda = 0.01
inequity_aversion_alpha = 1
inequity_aversion_beta = 0.01
rng = 73

[policy]
hidden_size = 128
num_layers = 4
expansion_factor = 1

[train]
gpus = 1
total_timesteps = 499122161
learning_rate = 0.00389515446
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.997960687
gae_lambda = 0.87280196
replay_ratio = 0.515574932
clip_coef = 0.784594059
vf_coef = 2.58257556
vf_clip_coef = 0.908112526
max_grad_norm = 1.3716346
ent_coef = 0.0202953778
anneal_ent_coef = 0
min_ent_coef_ratio = 0.100000001
momentum = 0.935435355
minibatch_size = 16384
horizon = 128
vtrace = 0
vtrace_rho_clip = 1
vtrace_c_clip = 1
verb_eps = 0
verb_eps_anneal_start = 0.400000006
verb_eps_anneal_end = 1
seed = 42
beta1 = 0.705128789
beta2 = 0.999000013
eps = 1.40319978e-09
prio_alpha = 0.276965231
prio_beta0 = 0.200000003
checkpoint_interval = 200

[sweep]
method = Protein 
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 50
gpus = -1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.env.inequity_aversion_gamma]
distribution = logit_normal
min = 0.9
max = 0.9999
scale = auto

[sweep.env.inequity_aversion_lambda]
distribution = logit_normal
min = 0.01
max = 0.99
scale = auto

[sweep.env.inequity_aversion_alpha]
distribution = logit_normal
min = 0.5
max = 3
scale = auto

[sweep.env.inequity_aversion_beta]
distribution = logit_normal
min = 0.001
max = 0.5
scale = auto
