[base]
env_name = cleanup

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 1

[env]
num_agents = 8
report_interval= 1
differentiate_other_agents_in_obs = True
shared_rewards = False
inequity_aversion = True
inequity_aversion_smoothed = True
inequity_aversion_lambda = 0.98
inequity_aversion_alpha = 0.99
inequity_aversion_beta = 0.01
rng = 73

[policy]
hidden_size = 128
num_layers = 4
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 500_000_000
learning_rate = 0.000167569
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.966343
gae_lambda = 0.959547
replay_ratio = 1.81876
clip_coef = 0.323166
vf_coef = 0.335022
vf_clip_coef = 0.01
max_grad_norm = 0.1
ent_coef = 4.25179e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.986395
beta2 = 0.999
eps = 4.30185e-09
minibatch_size = 8176
horizon = 128
vtrace_rho_clip = 1
vtrace_c_clip = 1
prio_alpha = 0.451167
prio_beta0 = 0.2
checkpoint_interval = 200

[sweep]
method = Protein 
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 50
gpus = -1
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 128
scale = auto
