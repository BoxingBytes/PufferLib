; hp_reward_scale = 0.07674633247055918
; held_food_reward_scale = 0.2643837513970884
held_food_reward_scale = 0.0
reward_fireplace_lit = 1
reward_store_chest = 0.0
; reward_store_chest = 1.0

[train]
device = cpu
total_timesteps = 50_000_000
use_rnd = False
rnd_int_coef = 1.0
rnd_ext_coef = 2.0
