[sweep]
method = Protein 
metric = score
goal = maximize
downsample = 5
use_gpu = True
prune_pareto = True

[sweep.env.reward_fireplace_lit]
distribution = uniform
min = -1.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.reward_store_chest]
distribution = uniform
min = -1.0
max = 1.0
mean = 0.5
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e10
mean = 2e8
scale = time