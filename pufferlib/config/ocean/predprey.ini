[base]
package = ocean
env_name = puffer_predprey
policy_name = Policy
rnn_name = Recurrent



[vec]
num_envs = 8

[env]
num_envs = 64
vision = 3 # MAP WALLING IS FOR 3 ONLY, BREAKS WITH OTHER VALUE
spawn_distance = 3 # spawn distance from fireplace, spawns further if there is obstacle
num_agents = 4
report_interval = 1
reward_death_scale = 0.0
; reward_death_scale = 0.14320154190448353
; reward_eat = 0.6301939255961027
reward_eat = 0.0
reward_collect = 0.2
